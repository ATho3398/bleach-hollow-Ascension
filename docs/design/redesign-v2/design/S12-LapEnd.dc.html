<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바퀴 끝 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bha.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Silkscreen&amp;display=swap">
<style>body{margin:0;background:#0d0a09}a{color:#cbbca6}a:hover{color:#efe5d3}
.cb{width:92px;height:104px;border-radius:var(--bha-r-md);box-sizing:border-box;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bha-bg-3);background-image:repeating-linear-gradient(45deg, rgb(0 0 0 / .18) 0 4px, transparent 4px 8px);box-shadow:0 0 0 1px var(--bha-line-2),inset 0 0 0 4px var(--bha-bg-2),inset 0 0 0 5px var(--bha-line-2);color:var(--bha-text-3)}
.mp{width:22px;height:22px;border-radius:var(--bha-r-xs);background:var(--c, var(--bha-bg-0));box-shadow:inset 0 0 0 1px var(--bha-line-1)}
</style>
</helmet>
<div class="sheet bha-theme-hollow" style="width: 1768px; height: 600px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; gap: 32px">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
      <div class="bha-theme-{{t.k}}" style="display: flex; flex-direction: column; gap: 8px">
        <div class="cap"><b style="color: var(--bha-text-1)">{{t.race}} · 바퀴 끝 창</b> — 타일 1장을 뒤집은 뒤, 초점: [한 바퀴 더]</div>
        <div class="bha-device">
          <button class="bha-dbtn bha-dbtn--up" aria-label="위"><i class="bha-i bha-i-up"></i></button>
          <button class="bha-dbtn bha-dbtn--down" aria-label="아래"><i class="bha-i bha-i-down"></i></button>
          <button class="bha-dbtn bha-dbtn--ok" aria-label="확인"><i class="bha-i bha-i-check" style="width: 28px; height: 28px"></i></button>
          <button class="bha-dbtn bha-dbtn--back" aria-label="뒤로"><i class="bha-i bha-i-left" style="width: 18px; height: 18px"></i></button>
          <div class="bha-lcd"><div class="bha-screen">
            <div class="bha-scene"><div class="bha-scene-bg" data-label="" style="background: linear-gradient(var(--bha-scene-wall) 0 60%, var(--bha-scene-floor) 60% 100%)"></div></div>
            <div class="bha-scrim"></div>
            <div class="bha-win" style="left: 47px; top: 15px; width: 552px; height: 330px">
              <div class="bha-win-head"><span class="bha-title bha-grow">2바퀴 끝</span><span class="bha-sub" style="padding-right: 10px">타일 1장을 고른다</span></div>
              <div class="bha-win-body" style="display: flex; flex-direction: column; gap: 10px; padding: 10px 14px">
                <div style="display: flex; gap: 10px; align-items: flex-end">
                  <button class="bha-card bha-card--tile is-sel" style="width: 92px; height: 104px; align-items: center; justify-content: center; gap: 4px; --c: var(--bha-tile-elite)"><span class="bha-art bha-art--frame" style="width: 40px; height: 40px; color: var(--bha-tile-elite)"><i class="bha-i bha-i-tile"></i></span><span class="bha-card-name" style="font-size: 13px; text-align: center">상급 호로</span><span class="bha-card-line" style="text-align: center">강적 · 좋은 보상</span></button>
                  <button class="cb" aria-label="뒤집기"><i class="bha-i bha-i-help bha-i--lg"></i></button>
                  <button class="cb" aria-label="뒤집기"><i class="bha-i bha-i-help bha-i--lg"></i></button>
                  <div style="display: flex; flex-direction: column; gap: 6px; margin-left: 8px; flex: 1 1 auto">
                    <span class="bha-label">손</span>
                    <div style="display: flex; gap: 4px">
                      <span class="bha-card" style="width: 44px; height: 44px; padding: 4px; align-items: center; justify-content: center; --c: var(--bha-tile-prey); box-shadow: 0 0 0 1px var(--bha-line-1), inset 0 -3px 0 var(--bha-tile-prey)"><i class="bha-i bha-i-tile" style="color: var(--bha-tile-prey)"></i></span>
                      <span class="bha-card" style="width: 44px; height: 44px; padding: 4px; align-items: center; justify-content: center; box-shadow: 0 0 0 1px var(--bha-line-1), inset 0 -3px 0 var(--bha-tile-rest)"><i class="bha-i bha-i-tile" style="color: var(--bha-tile-rest)"></i></span>
                      <span class="bha-card" style="width: 44px; height: 44px; padding: 4px; align-items: center; justify-content: center; box-shadow: 0 0 0 1px var(--bha-line-1), inset 0 -3px 0 var(--bha-tile-elite)"><i class="bha-i bha-i-tile" style="color: var(--bha-tile-elite)"></i></span>
                    </div>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px">
                  <span class="bha-label" style="width: 44px">배치판</span>
                  <div style="display: flex; gap: 3px">
                    <span class="mp" style="--c: var(--bha-text-3)"></span><span class="mp" style="--c: var(--bha-tile-prey)"></span><span class="mp" style="--c: var(--bha-tile-elite)"></span><span class="mp" style="--c: var(--bha-tile-rest)"></span><span class="mp" style="box-shadow: inset 0 0 0 2px var(--bha-focus)"></span><span class="mp"></span><span class="mp"></span><span class="mp"></span><span class="mp"></span><span class="mp"></span><span class="mp"></span>
                  </div>
                  <span class="bha-sub">다음 바퀴 길</span>
                </div>
              </div>
              <div class="bha-win-foot">
                <button class="bha-btn bha-btn--lg"><i class="bha-i bha-i-door"></i>귀환</button>
                <button class="bha-btn bha-btn--lg bha-btn--primary is-focus"><i class="bha-i bha-i-swap"></i>한 바퀴 더</button>
              </div>
            </div>
          </div></div>
        </div>
      </div>
    </sc-for>
  </div>
  <div class="bha-panel" style="padding: 14px 18px; display: flex; gap: 24px; align-items: flex-start">
    <div class="bha-label" style="white-space: nowrap; padding-top: 2px">바뀐 점</div>
    <ol style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; color: var(--bha-text-2)">
      <li>창 높이를 고정하고 뽑기 · 손 · 배치판을 위에서 아래로 한 번에 보이게 줄였다 (안에서만 바뀜)</li>
      <li>뒷면 카드는 사선 무늬 + 도트 ? 아이콘, 뒤집힌 카드는 타일 색 아랫면으로 손·배치판과 같은 색 말을 쓴다</li>
      <li>[귀환] / [한 바퀴 더]는 같은 크기 48px로 창 맨 아래 고정. 계속하는 쪽만 주 버튼 색</li>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1768,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ k: 'hollow', race: '호로' }, { k: 'shinigami', race: '사신' }] };
  }
}
</script>
</body>
</html>
