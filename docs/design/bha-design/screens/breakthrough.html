<!doctype html>
<html lang="ko" data-bha-theme="hollow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한계 돌파 — BHA</title>
<!--
  화면 10. 한계 돌파 — 리스크 게이지가 100을 넘은 순간
  ─ 샘플 데이터 ─────────────────────────────────────────
  riskName(종족)   : "광기" / "호로화"   → 제목 "{riskName}가 한계를 넘었다…" (종족 설정 riskOver)
  risk             : 104 / 100
  penalties[]      : 임시 페널티 설명 줄 (임시)
  연출: 균열 선이 그려지고(stroke-dashoffset), 화면이 2번 떨린다. reduced-motion이면 정지 화면.
-->
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/theme-hollow.css">
<link rel="stylesheet" href="../design-system/theme-shinigami.css">
<link rel="stylesheet" href="../design-system/base.css">
<link rel="stylesheet" href="../components/components.css">
<link rel="stylesheet" href="./screens.css">
<link rel="stylesheet" href="./_demo/demo.css">
</head>
<body>
<script src="../icons/sprite.js"></script>
<div class="bha-stage">
<main class="bha-app bha-break" id="brk">
  <svg class="bha-break__cracks" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true">
    <path d="M195 300 L170 250 L182 200 L150 140 L160 70 L130 0"/>
    <path d="M195 300 L240 270 L262 210 L310 180 L330 110 L390 80"/>
    <path d="M195 300 L150 330 L90 320 L60 380 L0 400"/>
    <path d="M195 300 L230 350 L300 370 L330 440 L390 470"/>
    <path d="M195 300 L200 380 L170 450 L190 540 L160 640"/>
    <path d="M182 200 L120 190 L80 220"/>
    <path d="M262 210 L270 150"/>
  </svg>
  <span class="bha-chip bha-chip--danger" style="position:relative"><svg class="bha-icon"><use href="#i-risk"/></svg>한계 돌파</span>
  <h1 class="bha-break__title"><span data-sp="riskOver" data-sp-tpl="…{}…">…광기가 한계를 넘었다…</span></h1>
  <div class="bha-break__gauge" style="position:relative">
    <div class="bha-meter bha-meter--risk is-danger" style="--fill:1"><div class="bha-meter__head"><span class="bha-meter__label"><svg class="bha-icon"><use href="#i-risk"/></svg><span data-sp="risk">광기</span></span><span class="bha-meter__value">104<small> / 100</small></span></div><div class="bha-meter__track"><i class="bha-meter__fill"></i><i class="bha-meter__zone" style="--zone:.6"></i></div></div>
  </div>
  <section class="bha-panel bha-break__penalty" style="position:relative">
    <header class="bha-panel__head"><h2 class="bha-panel__title"><svg class="bha-icon"><use href="#i-warn"/></svg>이번 원정 동안</h2><span class="bha-tag bha-tag--provisional">임시 페널티</span></header>
    <ul class="bha-stack bha-stack--tight bha-small" style="color:var(--bha-text-2)">
      <li>· 전투에 공허 블록이 더 자주 섞인다</li>
      <li>· <span data-sp="stab">자아</span>가 크게 떨어진다</li>
      <li>· 원정 결과에 '한계 돌파'가 기록된다</li>
    </ul>
  </section>
  <button class="bha-btn bha-btn--danger bha-btn--lg bha-btn--block" type="button" style="position:relative;background:var(--bha-bg-1)">계속</button>
</main>
</div>
<script>
  window.BHA_DEMO = { title: '10. 한계 돌파', initial: 'play', states: [['play', '연출 다시 보기']], onState: function () { var m = document.getElementById('brk'); var c = m.cloneNode(true); m.parentNode.replaceChild(c, m); } };
</script>
<script src="./_demo/demo.js"></script>
</body>
</html>
