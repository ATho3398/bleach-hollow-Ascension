<title>블록 아이콘 배치 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 위에 큰 확대 미리보기(블록 1~3개가 체인 판으로 이어진 모습, 끌어서 옮김), 아래에 조절 칸. 게임 도구라 어두운 한 가지 모습만 쓴다. */
:root{--bg:#141012;--panel:#1f191c;--line:#3b3035;--fg:#efe7da;--dim:#a8998f;--accent:#ff8a2a;--accent-ink:#1a1110;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--dim);margin:0;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stage{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bigbox{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;justify-content:center;
  background:repeating-conic-gradient(#221b1e 0 25%,#1a1517 0 50%) 0 0/24px 24px}
#big{display:block;height:auto;max-width:100%;image-rendering:pixelated;touch-action:none;cursor:grab}
.small{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;color:var(--dim);font-size:12px}
.small canvas{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.small div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel > *{min-width:0}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row input[type=number]{width:64px;font:14px var(--mono);font-variant-numeric:tabular-nums;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
select,button,input[type=file]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#out{font:13px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;user-select:all;margin:0}
#msg{color:var(--accent);font-size:13px;min-height:1.5em}
</style>
<div class="wrap">
  <h1>블록 아이콘 배치 도구</h1>
  <p class="sub">62×62 블록 안에서 아이콘의 크기와 자리를 맞춥니다. 블록 1개·체인2·체인3마다 아이콘과 값을 따로 둘 수 있습니다. 큰 그림을 끌어서 옮기고, 다 맞추면 값을 복사해 Claude에게 붙여 주세요.</p>
  <div class="tabs" role="group" aria-label="체인 단계">
    <button type="button" data-chain="1">블록 1개</button><button type="button" data-chain="2">체인 2</button><button type="button" data-chain="3">체인 3</button>
  </div>
  <div class="stage">
    <div class="bigbox"><canvas id="big" width="68" height="68" aria-label="확대 미리보기, 끌어서 아이콘 옮기기"></canvas></div>
    <div class="small">
      <div><canvas id="c1" width="68" height="68"></canvas>1배</div>
      <div><canvas id="c2" width="68" height="68"></canvas>2배</div>
    </div>
  </div>
  <div class="panel">
    <label>속성 색 (블록 테·체인 판)<select id="el"></select></label>
    <label>이 단계의 아이콘<select id="icon"></select></label>
    <label class="full">내 PNG로 바꿔 보기 (이 화면에서만)<input type="file" id="file" accept="image/png"></label>
    <label>크기 (px, 아이콘 한 변)<span class="row"><input type="range" id="sizeR" min="8" max="62" step="1"><input type="number" id="size" min="8" max="62" step="1"></span></label>
    <label>가로 자리 (가운데에서 오른쪽 +)<span class="row"><input type="range" id="xR" min="-31" max="31" step="1"><input type="number" id="x" min="-31" max="31" step="1"></span></label>
    <label>세로 자리 (가운데에서 아래 +)<span class="row"><input type="range" id="yR" min="-31" max="31" step="1"><input type="number" id="y" min="-31" max="31" step="1"></span></label>
    <div class="btns full"><button id="center" type="button">가운데로</button><button id="orig" type="button">원래 크기</button><button id="same" type="button">이 값을 세 단계에 똑같이</button><button id="copy" type="button" class="primary">값 복사</button></div>
    <pre id="out" class="full"></pre>
    <div id="msg" class="full" role="status"></div>
  </div>
</div>

function rr(x,y,x0,y0,n,r){x-=x0;y-=y0;if(!(x>=0&&x<n&&y>=0&&y<n))return false;const cx=Math.min(Math.max(x+.5,r),n-r),cy=Math.min(Math.max(y+.5,r),n-r);return (x+.5-cx)**2+(y+.5-cy)**2<=r*r;}
function canvasOf(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),d=g.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const col=fn(x,y);if(col){const i=(y*w+x)*4;d.data[i]=col[0];d.data[i+1]=col[1];d.data[i+2]=col[2];d.data[i+3]=255;}}g.putImageData(d,0,0);return c;}
function colorsOf(id){const e=ELS.find(v=>v[0]===id),c=rgb(e[2]);return id==='white'?{base:c,shade:[167,146,156],fill:[55,47,56]}:{base:c,shade:mix(c,DARK,.42),fill:mix(c,DARK,.8)};}
function frameOf(id){const k='f'+id;if(cache[k])return cache[k];const C=colorsOf(id);
  return cache[k]=canvasOf(N,N,(x,y)=>{if(!rr(x,y,0,0,N,R))return null;let l=3;for(const i of [1,2,3])if(!rr(x,y,i,i,N-2*i,R-i)){l=i-1;break;}return l===3?C.fill:l===2?C.shade:C.base;});}
function plateOf(id,n){const k='p'+id+n;if(cache[k])return cache[k];const C=colorsOf(id),w=n*N+(n-1)*GAP+2*M,h=N+2*M;
  const U=[];for(let y=0;y<h;y++){U.push([]);for(let x=0;x<w;x++){let v=false;for(let i=0;i<n&&!v;i++)v=rr(x,y,i*(N+GAP),0,N+2*M,R+M);U[y].push(v);}}
  const disc=[];for(let dx=-CR;dx<=CR;dx++)for(let dy=-CR;dy<=CR;dy++)if(dx*dx+dy*dy<=CR*CR+1)disc.push([dx,dy]);
  const g=(A,x,y)=>y>=0&&y<A.length&&x>=0&&x<A[0].length&&A[y][x];
  const Dl=[];for(let y=-CR;y<h+CR;y++){const r=[];for(let x=-CR;x<w+CR;x++)r.push(disc.some(([dx,dy])=>g(U,x+dx,y+dy)));Dl.push(r);}
  const Cl=[];for(let y=0;y<h;y++){const r=[];for(let x=0;x<w;x++)r.push(disc.every(([dx,dy])=>g(Dl,x+CR+dx,y+CR+dy)));Cl.push(r);}
  return cache[k]=canvasOf(w,h,(x,y)=>!Cl[y][x]?null:[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!g(Cl,x+dx,y+dy))?C.shade:C.base);}
const KEY='block-icon-place-v2';
let store={}; try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let chain=store.chain||1, custom=null;
const steps=store.steps||{1:null,2:null,3:null};
const nat=(id)=>imgs[id]?imgs[id].naturalWidth:48;
const cur=()=>steps[chain];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({steps,chain,el:$('el').value}))}catch(e){}};
const posOf=(s)=>({left:Math.round((N-s.size)/2)+s.x,top:Math.round((N-s.size)/2)+s.y});
function draw(){
  const s=cur(), ic=custom||imgs[s.icon], w=chain*N+(chain-1)*GAP+2*M, h=N+2*M, el=$('el').value, p=posOf(s);
  for(const [id,z] of [['big',0],['c1',1],['c2',2]]){const c=$(id);c.width=w;c.height=h;if(z)c.style.width=w*z+'px';else c.style.width=Math.min(w*6,760)+'px';
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    if(chain>1)g.drawImage(plateOf(el,chain),0,0);
    for(let i=0;i<chain;i++){const bx=M+i*(N+GAP);g.drawImage(frameOf(el),bx,M);g.save();g.beginPath();g.rect(bx,M,N,N);g.clip();g.drawImage(ic,bx+p.left,M+p.top,s.size,s.size);g.restore();}}
  for(const k of ['size','x','y']){$(k).value=s[k];$(k+'R').value=s[k];}
  $('icon').value=s.icon;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.chain)===chain)));
  const line=(n)=>{const v=steps[n],q=posOf(v);return `${n===1?'블록 1개':'체인 '+n}: ${n===chain&&custom?'(올린 PNG)':v.icon} · 크기 ${v.size}px · 왼쪽 ${q.left}px, 위 ${q.top}px (x ${v.x}, y ${v.y})`;};
  $('out').textContent=`속성 색: ${el}\n${line(1)}\n${line(2)}\n${line(3)}`;
}
function set(k,v){v=Math.round(Number(v));if(Number.isNaN(v))return;const lim=k==='size'?[8,62]:[-31,31];cur()[k]=Math.max(lim[0],Math.min(lim[1],v));save();draw();}
for(const k of ['size','x','y']){$(k).addEventListener('input',e=>set(k,e.target.value));$(k+'R').addEventListener('input',e=>set(k,e.target.value));}
$('center').onclick=()=>{cur().x=0;cur().y=0;save();draw();};
$('orig').onclick=()=>set('size',custom?Math.min(62,custom.naturalWidth):nat(cur().icon));
$('same').onclick=()=>{for(const n of [1,2,3])steps[n]={...cur()};save();draw();$('msg').textContent='세 단계를 같은 아이콘·값으로 맞췄습니다.';};
$('icon').onchange=()=>{custom=null;cur().icon=$('icon').value;cur().size=Math.min(62,nat(cur().icon));save();draw();};
$('el').onchange=()=>{save();draw();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{chain=Number(b.dataset.chain);custom=null;save();draw();});
$('file').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{custom=await load(r.result);cur().size=Math.min(62,custom.naturalWidth);cur().x=0;cur().y=0;draw();};r.readAsDataURL(f);};
let drag=null;const big=$('big');
big.addEventListener('pointerdown',e=>{big.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:cur().x,y:cur().y};});
big.addEventListener('pointermove',e=>{if(!drag)return;const sc=big.getBoundingClientRect().width/big.width,s=cur();s.x=Math.max(-31,Math.min(31,drag.x+Math.round((e.clientX-drag.px)/sc)));s.y=Math.max(-31,Math.min(31,drag.y+Math.round((e.clientY-drag.py)/sc)));draw();});
const end=()=>{if(drag){drag=null;save();}};big.addEventListener('pointerup',end);big.addEventListener('pointercancel',end);
$('copy').onclick=async()=>{const t=$('out').textContent;try{await navigator.clipboard.writeText(t);$('msg').textContent='복사했습니다. Claude에게 붙여 주세요.';}catch(e){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('msg').textContent='자동 복사가 막혔습니다. 선택된 글자를 직접 복사해 주세요.';}};
(async()=>{
  for(const e of ELS)$('el').add(new Option(e[1],e[0]));
  for(const i of ICONS){$('icon').add(new Option(i.name,i.id));imgs[i.id]=await load(i.src);}
  if(store.el&&ELS.some(e=>e[0]===store.el))$('el').value=store.el;
  for(const n of [1,2,3])if(!steps[n]||!imgs[steps[n].icon])steps[n]={icon:ICONS[0].id,size:nat(ICONS[0].id),x:0,y:0};
  draw();
})();
</script>
