<title>블록 아이콘 배치 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 위에 큰 확대 미리보기(블록 1~3개가 체인 판으로 이어진 모습, 끌어서 옮김), 아래에 조절 칸. 게임 도구라 어두운 한 가지 모습만 쓴다. */
:root{--bg:#141012;--panel:#1f191c;--line:#3b3035;--fg:#efe7da;--dim:#a8998f;--accent:#ff8a2a;--accent-ink:#1a1110;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--dim);margin:0;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stage{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bigbox{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;justify-content:center;
  background:repeating-conic-gradient(#221b1e 0 25%,#1a1517 0 50%) 0 0/24px 24px}
#big{display:block;height:auto;max-width:100%;image-rendering:pixelated;touch-action:none;cursor:grab}
.small{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;color:var(--dim);font-size:12px}
.small canvas{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.small div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel > *{min-width:0}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row input[type=number]{width:64px;font:14px var(--mono);font-variant-numeric:tabular-nums;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
select,button,input[type=file]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#out{font:13px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;user-select:all;margin:0}
#msg{color:var(--accent);font-size:13px;min-height:1.5em}
</style>
<div class="wrap">
  <h1>블록 아이콘 배치 도구</h1>
  <p class="sub">62×62 블록 안에서 아이콘의 크기와 자리를 맞춥니다. 크기·자리·회전은 그림마다 따로 기억합니다. 블록 1개·체인 2·체인 3에 어느 그림을 넣을지도 따로 고릅니다. 큰 그림을 끌어서 옮기고, 다 맞추면 [저장]을 눌러 주세요.</p>
  <div class="tabs" role="group" aria-label="체인 단계">
    <button type="button" data-chain="1">블록 1개</button><button type="button" data-chain="2">체인 2</button><button type="button" data-chain="3">체인 3</button>
  </div>
  <div class="stage">
    <div class="bigbox"><canvas id="big" width="68" height="68" aria-label="확대 미리보기, 끌어서 아이콘 옮기기"></canvas></div>
    <div class="small">
      <div><canvas id="c1" width="68" height="68"></canvas>1배</div>
      <div><canvas id="c2" width="68" height="68"></canvas>2배</div>
    </div>
  </div>
  <div class="panel">
    <label>속성 색 (블록 테·체인 판)<select id="el"></select></label>
    <label>이 단계에 넣을 그림<select id="icon"></select></label>
    <label class="full">내 PNG로 바꿔 보기 (이 화면에서만, 저장 안 됨)<input type="file" id="file" accept="image/png"></label>
    <label>크기 (px, 한 변)<span class="row"><input type="range" id="sizeR" min="8" max="62" step="1"><input type="number" id="size" min="8" max="62" step="1"></span></label>
    <label>회전 (도, 시계 방향 +)<span class="row"><input type="range" id="rotR" min="-180" max="180" step="1"><input type="number" id="rot" min="-180" max="180" step="1"></span></label>
    <label>가로 자리 (가운데에서 오른쪽 +)<span class="row"><input type="range" id="xR" min="-31" max="31" step="1"><input type="number" id="x" min="-31" max="31" step="1"></span></label>
    <label>세로 자리 (가운데에서 아래 +)<span class="row"><input type="range" id="yR" min="-31" max="31" step="1"><input type="number" id="y" min="-31" max="31" step="1"></span></label>
    <div class="btns full"><button id="center" type="button">그림 가운데로</button><button id="orig" type="button">원래 크기·회전</button><button id="save" type="button" class="primary">저장</button><button id="copy" type="button">값 복사</button></div>
    <div id="msg" class="full" role="status"></div>
    <pre id="out" class="full"></pre>
  </div>
</div>

  const Dl=[];for(let y=-CR;y<h+CR;y++){const r=[];for(let x=-CR;x<w+CR;x++)r.push(disc.some(([dx,dy])=>g(U,x+dx,y+dy)));Dl.push(r);}
  const Cl=[];for(let y=0;y<h;y++){const r=[];for(let x=0;x<w;x++)r.push(disc.every(([dx,dy])=>g(Dl,x+CR+dx,y+CR+dy)));Cl.push(r);}
  return cache[k]=canvasOf(w,h,(x,y)=>!Cl[y][x]?null:[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!g(Cl,x+dx,y+dy))?C.shade:C.base);}
/* 그림의 실제 칠해진 부분이 블록 가운데에 오게 하는 자리(크기·회전 0 기준) */
function centerOf(img,size){const c=document.createElement('canvas');c.width=c.height=img.naturalWidth;const g=c.getContext('2d');g.drawImage(img,0,0);const d=g.getImageData(0,0,c.width,c.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>60){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  if(x1<0)return{x:0,y:0};const k=size/c.width;return{x:Math.round((c.width/2-(x0+x1+1)/2)*k),y:Math.round((c.height/2-(y0+y1+1)/2)*k)};}
const KEY='block-icon-place-v3';
/* 상태: 그림마다 자리 값(place), 체인 단계마다 어느 그림인지(steps) */
let state={place:{},steps:{1:null,2:null,3:null},el:'white'}, chain=1, custom=null, customPlace=null, db=null, dirty=false;
const nat=(id)=>imgs[id]?imgs[id].naturalWidth:48;
const fresh=(id)=>DEFAULTS[id]?{...DEFAULTS[id]}:{size:Math.min(62,nat(id)),rot:0,...centerOf(imgs[id],Math.min(62,nat(id)))};
function adopt(s){if(!s)return;if(s.place)for(const k in s.place)if(imgs[k])state.place[k]={size:48,x:0,y:0,rot:0,...s.place[k]};if(s.steps)for(const n of [1,2,3])if(imgs[s.steps[n]])state.steps[n]=s.steps[n];if(s.el&&ELS.some(e=>e[0]===s.el))state.el=s.el;}
const cur=()=>custom?customPlace:state.place[state.steps[chain]];
const local=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const touch=()=>{dirty=true;local();};
const posOf=(s)=>({left:Math.round((N-s.size)/2)+s.x,top:Math.round((N-s.size)/2)+s.y});
function draw(){
  const s=cur(), ic=custom||imgs[state.steps[chain]], w=chain*N+(chain-1)*GAP+2*M, h=N+2*M, el=state.el;
  for(const [id,z] of [['big',0],['c1',1],['c2',2]]){const c=$(id);c.width=w;c.height=h;c.style.width=(z?w*z:Math.min(w*6,760))+'px';
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    if(chain>1)g.drawImage(plateOf(el,chain),0,0);
    for(let i=0;i<chain;i++){const bx=M+i*(N+GAP);g.drawImage(frameOf(el),bx,M);g.save();g.beginPath();g.rect(bx,M,N,N);g.clip();g.translate(bx+N/2+s.x,M+N/2+s.y);g.rotate(s.rot*Math.PI/180);g.drawImage(ic,-s.size/2,-s.size/2,s.size,s.size);g.restore();}}
  for(const k of ['size','x','y','rot']){$(k).value=s[k];$(k+'R').value=s[k];}
  $('icon').value=state.steps[chain];$('el').value=el;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.chain)===chain)));
  const L=[`속성 색: ${el}`];
  for(const n of [1,2,3])L.push(`${n===1?'블록 1개':'체인 '+n}: ${state.steps[n]}`);
  for(const i of ICONS){const v=state.place[i.id],q=posOf(v);L.push(`${i.id}: 크기 ${v.size}px · 회전 ${v.rot}° · 왼쪽 ${q.left}px, 위 ${q.top}px (x ${v.x}, y ${v.y})`);}
  $('out').textContent=L.join('\n');
}
function set(k,v){v=Math.round(Number(v));if(Number.isNaN(v))return;const lim=k==='size'?[8,62]:k==='rot'?[-180,180]:[-31,31];cur()[k]=Math.max(lim[0],Math.min(lim[1],v));if(!custom)touch();draw();}
for(const k of ['size','x','y','rot']){$(k).addEventListener('input',e=>set(k,e.target.value));$(k+'R').addEventListener('input',e=>set(k,e.target.value));}
$('center').onclick=()=>{const s=cur(),c=centerOf(custom||imgs[state.steps[chain]],s.size);s.x=c.x;s.y=c.y;if(!custom)touch();draw();};
$('orig').onclick=()=>{const s=cur();s.size=Math.min(62,custom?custom.naturalWidth:nat(state.steps[chain]));s.rot=0;if(!custom)touch();draw();};
$('icon').onchange=()=>{custom=null;state.steps[chain]=$('icon').value;touch();draw();};
$('el').onchange=()=>{state.el=$('el').value;touch();draw();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{chain=Number(b.dataset.chain);custom=null;draw();});
$('file').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{custom=await load(r.result);const sz=Math.min(62,custom.naturalWidth);customPlace={size:sz,rot:0,...centerOf(custom,sz)};draw();};r.readAsDataURL(f);};
let drag=null;const big=$('big');
big.addEventListener('pointerdown',e=>{big.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:cur().x,y:cur().y};});
big.addEventListener('pointermove',e=>{if(!drag)return;const sc=big.getBoundingClientRect().width/big.width,s=cur();s.x=Math.max(-31,Math.min(31,drag.x+Math.round((e.clientX-drag.px)/sc)));s.y=Math.max(-31,Math.min(31,drag.y+Math.round((e.clientY-drag.py)/sc)));draw();});
const end=()=>{if(drag){drag=null;if(!custom)touch();}};big.addEventListener('pointerup',end);big.addEventListener('pointercancel',end);
$('copy').onclick=async()=>{const t=$('out').textContent;try{await navigator.clipboard.writeText(t);$('msg').textContent='복사했습니다.';}catch(e){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('msg').textContent='자동 복사가 막혔습니다. 선택된 글자를 직접 복사해 주세요.';}};
let saving=false;
$('save').onclick=async()=>{
  if(saving)return;
  if(!db){$('msg').textContent='이 화면에서는 저장할 수 없습니다(로그인한 claude.ai 에서 열어 주세요). [값 복사]로 대신 전해 주세요.';return;}
  saving=true;$('msg').textContent='저장하는 중…';
  try{await db.doc('placements/current').set({place:state.place,steps:state.steps,el:state.el,savedAt:new Date().toISOString()});dirty=false;$('msg').textContent='저장했습니다. Claude가 이 값을 읽을 수 있습니다.';}
  catch(e){$('msg').textContent='저장하지 못했습니다: '+(e&&e.message||e&&e.code||'알 수 없는 문제')+'. [값 복사]로 대신 전해 주세요.';}
  saving=false;
};
(async()=>{
  for(const e of ELS)$('el').add(new Option(e[1],e[0]));
  for(const i of ICONS){$('icon').add(new Option(i.name,i.id));imgs[i.id]=await load(i.src);}
  for(const i of ICONS)state.place[i.id]=fresh(i.id);
  for(const n of [1,2,3])state.steps[n]=ICONS[0].id;
  let had=false;try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){adopt(s);had=true;}}catch(e){}
  draw();
  $('msg').textContent='저장된 값을 불러오는 중…';
  try{
    db=await (window.claude&&window.claude.use?window.claude.use('db'):null);
    if(db){const snap=await Promise.race([db.doc('placements/current').get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과')),10000))]);
      if(snap.exists&&!dirty){adopt(snap.data());local();draw();$('msg').textContent='저장된 값을 불러왔습니다.';}
      else $('msg').textContent=snap.exists?'':'아직 저장된 값이 없습니다. 맞춘 뒤 [저장]을 눌러 주세요.';}
    else $('msg').textContent='이 화면에서는 저장 기능을 쓸 수 없습니다. [값 복사]를 써 주세요.';
  }catch(e){$('msg').textContent='저장된 값을 불러오지 못했습니다. 지금 화면의 값으로 계속할 수 있습니다.';}
})();
</script>
