<title>블록 아이콘 배치 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 왼쪽 큰 확대 미리보기(끌어서 옮김), 오른쪽 조절 칸. 폰 폭에서는 위아래로 쌓인다. 게임 도구라 어두운 한 가지 모습만 쓴다. */
:root{--bg:#141012;--panel:#1f191c;--line:#3b3035;--fg:#efe7da;--dim:#a8998f;--accent:#ff8a2a;--accent-ink:#1a1110;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--dim);margin:0;font-size:13px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.stage{flex:0 1 372px;min-width:0;display:flex;flex-direction:column;gap:10px}
.panel{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#big{width:100%;max-width:372px;aspect-ratio:1/1;image-rendering:pixelated;touch-action:none;cursor:grab;border:1px solid var(--line);border-radius:6px;
  background:repeating-conic-gradient(#221b1e 0 25%,#1a1517 0 50%) 0 0/24px 24px}
.small{display:flex;gap:14px;align-items:flex-end;color:var(--dim);font-size:12px}
.small canvas{image-rendering:pixelated;display:block}
.small div{display:flex;flex-direction:column;gap:4px;align-items:center}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row input[type=number]{width:64px;font:14px var(--mono);font-variant-numeric:tabular-nums;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
select,button,input[type=file]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#out{font:13px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;user-select:all;margin:0}
#msg{color:var(--accent);font-size:13px;min-height:1.5em}
</style>
<div class="wrap">
  <h1>블록 아이콘 배치 도구</h1>
  <p class="sub">62×62 블록 사각형 안에서 아이콘의 크기와 자리를 맞춥니다. 큰 그림을 끌어서 옮기고, 다 맞추면 값을 복사해 Claude에게 붙여 주세요.</p>
  <div class="cols">
    <div class="stage">
      <canvas id="big" width="62" height="62" aria-label="확대 미리보기, 끌어서 아이콘 옮기기"></canvas>
      <div class="small">
        <div><canvas id="c1" width="62" height="62" style="width:62px;height:62px"></canvas>1배</div>
        <div><canvas id="c2" width="62" height="62" style="width:124px;height:124px"></canvas>2배</div>
      </div>
    </div>
    <div class="panel">
      <label>사각형<select id="frame"></select></label>
      <label>아이콘<select id="icon"></select></label>
      <label>내 PNG로 바꿔 보기 (이 화면에서만)<input type="file" id="file" accept="image/png"></label>
      <label>크기 (px, 아이콘 한 변)<span class="row"><input type="range" id="sizeR" min="8" max="62" step="1"><input type="number" id="size" min="8" max="62" step="1"></span></label>
      <label>가로 자리 (가운데에서 오른쪽 +)<span class="row"><input type="range" id="xR" min="-31" max="31" step="1"><input type="number" id="x" min="-31" max="31" step="1"></span></label>
      <label>세로 자리 (가운데에서 아래 +)<span class="row"><input type="range" id="yR" min="-31" max="31" step="1"><input type="number" id="y" min="-31" max="31" step="1"></span></label>
      <div class="btns"><button id="center" type="button">가운데로</button><button id="orig" type="button">원래 크기</button><button id="copy" type="button" class="primary">값 복사</button></div>
      <pre id="out"></pre>
      <div id="msg" role="status"></div>
    </div>
  </div>
</div>

const $=(id)=>document.getElementById(id);
const imgs={};
const load=(src)=>new Promise((res)=>{const i=new Image();i.onload=()=>res(i);i.src=src;});
const KEY='block-icon-place-v1';
let store={}; try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let st={size:48,x:0,y:0}, custom=null, native=48;
const save=()=>{store[$('icon').value]={...st};store._frame=$('frame').value;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
function pos(){return {left:Math.round((62-st.size)/2)+st.x, top:Math.round((62-st.size)/2)+st.y};}
function draw(){
  const f=imgs['f:'+$('frame').value], ic=custom||imgs['i:'+$('icon').value]; if(!f||!ic) return;
  const p=pos();
  for(const id of ['big','c1','c2']){const c=$(id),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,62,62);g.drawImage(f,0,0);g.drawImage(ic,p.left,p.top,st.size,st.size);}
  for(const k of ['size','x','y']){$(k).value=st[k];$(k+'R').value=st[k];}
  $('out').textContent=`아이콘: ${custom?'(올린 PNG)':$('icon').value}\n사각형: ${$('frame').value}\n크기: ${st.size}px (원본 ${native}px)\n자리: 왼쪽 ${p.left}px, 위 ${p.top}px (가운데 기준 x ${st.x}, y ${st.y})`;
}
function set(k,v){v=Math.round(Number(v));if(Number.isNaN(v))return;const lim=k==='size'?[8,62]:[-31,31];st[k]=Math.max(lim[0],Math.min(lim[1],v));save();draw();}
for(const k of ['size','x','y']){$(k).addEventListener('input',e=>set(k,e.target.value));$(k+'R').addEventListener('input',e=>set(k,e.target.value));}
$('center').onclick=()=>{st.x=0;st.y=0;save();draw();};
$('orig').onclick=()=>{set('size',native);};
function pickIcon(){custom=null;const ic=imgs['i:'+$('icon').value];native=ic?ic.naturalWidth:48;st=store[$('icon').value]?{...store[$('icon').value]}:{size:native,x:0,y:0};draw();}
$('icon').onchange=pickIcon;
$('frame').onchange=()=>{save();draw();};
$('file').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{custom=await load(r.result);native=custom.naturalWidth;st={size:Math.min(62,native),x:0,y:0};draw();};r.readAsDataURL(f);};
let drag=null;const big=$('big');
big.addEventListener('pointerdown',e=>{big.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:st.x,y:st.y};});
big.addEventListener('pointermove',e=>{if(!drag)return;const s=big.getBoundingClientRect().width/62;st.x=Math.max(-31,Math.min(31,drag.x+Math.round((e.clientX-drag.px)/s)));st.y=Math.max(-31,Math.min(31,drag.y+Math.round((e.clientY-drag.py)/s)));draw();});
const end=()=>{if(drag){drag=null;save();}};big.addEventListener('pointerup',end);big.addEventListener('pointercancel',end);
$('copy').onclick=async()=>{const t=$('out').textContent;try{await navigator.clipboard.writeText(t);$('msg').textContent='복사했습니다. Claude에게 붙여 주세요.';}catch(e){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('msg').textContent='자동 복사가 막혔습니다. 선택된 글자를 직접 복사해 주세요.';}};
(async()=>{
  for(const f of FRAMES){$('frame').add(new Option(f.name,f.id));imgs['f:'+f.id]=await load(f.src);}
  for(const i of ICONS){$('icon').add(new Option(i.name,i.id));imgs['i:'+i.id]=await load(i.src);}
  if(store._frame&&imgs['f:'+store._frame])$('frame').value=store._frame;
  pickIcon();
})();
</script>
