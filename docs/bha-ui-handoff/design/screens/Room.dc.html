<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>방(둥지)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bha.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bha-root bha-{{theme}}">
  <div class="bha-scene"></div>
  <div style="position:absolute;left:12px;top:40px;font-size:12px;color:var(--bha-text-3)">{{place}} 둥지</div>

  <!-- 알림 띠 -->
  <div class="bha-notice" role="status">
    <svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"></circle><path d="M9 13l-1 8 4-2 4 2-1-8"></path></svg>
    <span><b>튜토리얼 달성</b> — 보상 큰 사냥감 2 · 영옥 1 · 첫 진화</span>
  </div>

  <!-- 방 물건 5개 -->
  <a href="#" class="bha-art" style="left:20px;top:66px;width:88px;height:108px;text-decoration:none" aria-label="모험 (문)">문<span class="bha-nametag">모험</span></a>
  <a href="#" class="bha-art" style="left:126px;top:58px;width:84px;height:96px;text-decoration:none" aria-label="책장">책장 그림<span class="bha-nametag">책장</span></a>
  <a href="#" class="bha-art" style="left:120px;top:176px;width:100px;height:72px;text-decoration:none" aria-label="보관함">보관함 그림<span class="bha-nametag">보관함</span></a>
  <a href="#" class="bha-art" style="left:424px;top:150px;width:104px;height:96px;text-decoration:none" aria-label="상점">상점 그림<span class="bha-nametag">상점</span></a>
  <a href="#" class="bha-art" style="left:536px;top:58px;width:88px;height:108px;text-decoration:none" aria-label="수련장">수련장 그림<span class="bha-nametag">수련장</span></a>

  <!-- 말풍선 → 상태 칩 → 캐릭터 (세로 순서 고정) -->
  <div class="bha-bubble" style="left:50%;transform:translateX(-50%);top:36px">오래도 비웠군. 배가 텅 비었다.</div>
  <button class="bha-statchip" style="left:262px;top:62px;width:116px;color:var(--bha-text-1)" aria-label="상태 보기 — 허기 22, 컨디션 70, {{mad}} 8">
    <span>허기</span><span class="bha-gauge bha-gauge--hunger"><span class="bha-gauge__fill" style="width:22%"></span></span>
    <span>컨디션</span><span class="bha-gauge bha-gauge--cond"><span class="bha-gauge__fill" style="width:70%"></span></span>
    <span>{{mad}}</span><span class="bha-gauge bha-gauge--mad"><span class="bha-gauge__fill" style="width:8%;min-width:4px"></span></span>
  </button>
  <div class="bha-art bha-art--char" style="left:264px;top:122px;width:112px;height:124px">캐릭터<br>도트 그림</div>

  <!-- 독 -->
  <nav class="bha-dock" aria-label="돌보기">
    <button class="bha-btn bha-btn--feed"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0zM9 4v4M13 4v4"></path></svg>먹이 주기</button>
    <button class="bha-btn bha-btn--sleep"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h5l-5 6h5M13 4h7l-7 9h7"></path></svg>재우기</button>
    <button class="bha-btn bha-btn--bond"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.5-1.5L8 14"></path></svg>교감</button>
    <button class="bha-btn bha-btn--ghost bha-more {{moreCls}}" aria-label="더보기" aria-expanded="{{moreOpen}}"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </nav>

  <!-- 더보기 메뉴 -->
  <sc-if value="{{moreOpen}}" hint-placeholder-val="{{ false }}">
    <div class="bha-modal" role="menu" style="right:8px;bottom:62px;width:318px;padding:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;z-index:25">
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">{{rankLabel}}</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">설정</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">도움말</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">튜토리얼</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start;color:var(--bha-rare)">붕옥</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">사진</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">다마고치 모드</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start;color:var(--bha-danger)">테스트</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">백업·불러오기</button>
      <button class="bha-btn bha-btn--sm bha-btn--ghost" role="menuitem" style="justify-content:flex-start">처음 화면</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["hollow","soul"],"default":"hollow"},"variant":{"editor":"enum","options":["base","more"],"default":"base"},"$preview":{"width":640,"height":330}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'hollow';
    const soul = theme === 'soul';
    const moreOpen = (this.props.variant ?? 'base') === 'more';
    return {
      theme,
      place: soul ? '소울 소사이어티' : '웨코문도',
      mad: '광기',
      rankLabel: soul ? '석차 도전' : '번호 쟁탈전',
      moreOpen,
      moreCls: moreOpen ? 'is-focus' : ''
    };
  }
}
</script>
</body>
</html>
