<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원정 출발(배치)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bha.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bha-root bha-{{theme}}">
  <!-- 머리 -->
  <div style="position:absolute;left:12px;right:8px;top:4px;height:40px;display:flex;align-items:center;gap:8px">
    <button class="bha-titletoggle bha-display bha-lg" aria-label="원정 종류 바꾸기 (자유·스토리·탑)">자유 원정<svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <span class="bha-chip" style="color:var(--bha-text-1)">{{ground}}</span>
    <button class="bha-btn bha-btn--sm bha-btn--ghost bha-iconbtn" style="margin-left:auto" aria-label="도움말"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"></path></svg></button>
  </div>
  <!-- 난이도 -->
  <div style="position:absolute;left:12px;top:46px;display:flex;align-items:center;gap:4px" role="radiogroup" aria-label="난이도">
    <span class="bha-xs bha-t2 bha-b" style="margin-right:4px">난이도</span>
    <button class="bha-tab" role="radio" aria-checked="false">★1</button>
    <button class="bha-tab" role="radio" aria-checked="false">★2</button>
    <button class="bha-tab is-active" role="radio" aria-checked="true">★3<span class="bha-chip" style="height:18px;padding:0 5px;color:var(--bha-rare);border-color:var(--bha-rare)">권장</span></button>
    <button class="bha-tab is-disabled" style="opacity:.5" aria-disabled="true"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>★4</button>
    <button class="bha-tab is-disabled" style="opacity:.5" aria-disabled="true"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>★5</button>
  </div>
  <div class="bha-xs bha-t2" style="position:absolute;left:12px;right:12px;top:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">★3 · 권장: 적은 3단계(아쥬커스) 기준 · 먹이·노력치 +50% · 골드 +20%</div>

  <!-- 왼쪽: 길 + 프리셋 (영역 스크롤) -->
  <div class="bha-scroll" style="position:absolute;left:12px;top:108px;width:322px;bottom:6px;padding-right:4px">
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px">
      <div class="bha-slot bha-slot--nest" style="height:48px" aria-label="둥지 칸"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--bha-text-1)"><path d="M3 11l9-7 9 7M5 10v10h14V10"></path></svg></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">1</span></div>
      <div class="bha-slot bha-slot--filled bha-tile--hollow" style="height:48px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-bottom:6px">
        <span class="bha-tileico" style="width:22px;height:22px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
        <span style="font-size:12px;font-weight:700;letter-spacing:-.04em;white-space:nowrap">하급 호로</span><span class="bha-slot__no" style="bottom:0">2</span></div>
      <div class="bha-slot bha-slot--filled bha-tile--wander" style="height:48px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-bottom:6px">
        <span class="bha-tileico" style="width:22px;height:22px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></span>
        <span style="font-size:12px;font-weight:700;letter-spacing:-.04em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 2px">떠도는 영혼</span><span class="bha-slot__no" style="bottom:0">3</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">4</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">5</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">6</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">7</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">8</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">9</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">10</span></div>
      <div class="bha-slot is-droppable" style="height:48px"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg><span class="bha-slot__no">11</span></div>
    </div>
    <div style="position:relative;height:0"><span class="bha-synergy" style="left:118px;top:-62px">시너지 [이름]</span></div>
    <div class="bha-drag bha-tile--hollow" style="position:absolute;left:190px;top:14px" aria-hidden="true"><svg class="bha-svg" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
    <div class="bha-xs bha-t3" style="margin:6px 0 8px">놓은 칸 2 / 최대 8 · 고른 뒤 빈 칸을 누르거나 끌어서 놓는다</div>

    <div class="bha-panel" style="padding:8px;display:grid;gap:6px">
      <div class="bha-row"><span class="bha-sm bha-b">배치 프리셋 1/5</span></div>
      <div style="display:flex;gap:6px">
        <label style="flex:1;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden">프리셋 이름</span><input placeholder="프리셋 이름" style="flex:1;min-width:0;height:36px;border-radius:6px;border:1px solid var(--bha-line-2);background:var(--bha-bg-0);color:var(--bha-text-1);padding:0 8px;font:13px var(--bha-font-body)"></label>
        <button class="bha-btn bha-btn--sm"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"></path></svg>현재 배치 저장</button>
      </div>
      <div class="bha-panel--flat" style="border-radius:8px;border:1px solid var(--bha-line-1);padding:6px;display:grid;gap:5px">
        <span class="bha-sm bha-b">사냥 위주</span>
        <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;height:10px">
          <i style="background:var(--bha-text-2);border-radius:2px"></i><i style="background:#dc8a5c;border-radius:2px"></i><i style="background:#dc8a5c;border-radius:2px"></i><i style="background:#cf78bf;border-radius:2px"></i><i style="background:#b48d62;border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i><i style="background:var(--bha-bg-4);border-radius:2px"></i>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
          <button class="bha-btn bha-btn--sm" style="padding:0 4px">불러오기</button><button class="bha-btn bha-btn--sm" style="padding:0 4px">덮어쓰기</button><button class="bha-btn bha-btn--sm bha-btn--ghost" style="padding:0 4px">이름</button><button class="bha-btn bha-btn--sm bha-btn--danger" style="padding:0 4px">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 가진 타일 + 출발 -->
  <div style="position:absolute;left:344px;right:10px;top:108px;display:flex;align-items:center;justify-content:space-between"><span class="bha-sec">가진 타일</span><span class="bha-xs bha-t3">13장</span></div>
  <div class="bha-scroll" style="position:absolute;left:344px;right:8px;top:128px;height:144px;padding:2px 4px 2px 2px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start">
    <button class="bha-tilecard bha-tile--wander is-empty" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×0</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></span><span class="bha-sm bha-b">떠도는 영혼</span><span class="bha-xs bha-t2">약한 적 출현</span></button>
    <button class="bha-tilecard bha-tile--hollow is-selected is-dragging" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×1</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span><span class="bha-sm bha-b">하급 호로</span><span class="bha-xs bha-t2">약한 적 출현</span></button>
    <button class="bha-tilecard bha-tile--elite" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×3</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg></span><span class="bha-sm bha-b">상급 호로</span><span class="bha-xs bha-t2" style="line-height:1.2">강적 출현 + 좋은 보상</span></button>
    <button class="bha-tilecard bha-tile--altar" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×1</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 5h6l-3 5 3 5h-6l-3 5-3-5H3l3-5-3-5h6z"></path></svg></span><span class="bha-sm bha-b">제단</span><span class="bha-xs bha-t2">[한 줄 효과]</span></button>
    <button class="bha-tilecard bha-tile--merchant" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×2</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1 11H5zM8 9V6a4 4 0 0 1 8 0v3"></path></svg></span><span class="bha-sm bha-b">보물</span><span class="bha-xs bha-t2">[한 줄 효과]</span></button>
    <button class="bha-tilecard bha-tile--trap" style="height:88px;font-family:inherit;color:inherit"><span class="bha-badge">×1</span>
      <span class="bha-tileico"><svg class="bha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.01"></path></svg></span><span class="bha-sm bha-b">함정</span><span class="bha-xs bha-t2">[한 줄 효과]</span></button>
  </div>
  <button class="bha-btn bha-btn--accent" style="position:absolute;left:344px;right:8px;bottom:6px;height:46px;font-size:16px" >
    <span class="bha-display" style="font-size:18px">출발</span><span class="bha-xs" style="font-weight:500;opacity:.9">★3 · 칸 2개</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["hollow","soul"],"default":"hollow"},"$preview":{"width":640,"height":330}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'hollow';
    return { theme, ground: theme === 'soul' ? '소울 소사이어티 외곽' : '웨코문도 외곽' };
  }
}
</script>
</body>
</html>
