<title>이펙트 배치 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 한 화면 도구: 위 = 실제 전투 화면(1배 캡처) 무대 + 재생, 아래 = 계열·블록 → 연타 → 이펙트 1~3 편집. 게임과 같은 어두운 기기 화면 하나로 고정 */
:root {
  --bg: #0f1116; --panel: #181b23; --line: #2a2f3b; --fg: #e8e4da; --dim: #9a9ca6;
  --accent: #e8c26a; --accent-ink: #1a1408; --ok: #7cc48a; --mark-a: #6ab8e8;
  --font: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
main { display: flex; flex-direction: column; gap: 10px; max-width: 900px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
.dim { color: var(--dim); font-size: 12px; }
#stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: grab; background: #000; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world img { display: block; width: 100%; height: 100%; image-rendering: pixelated; user-select: none; pointer-events: none; }
.pxfx { position: absolute; image-rendering: pixelated; pointer-events: none; }
.mark, #dot { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
.mark { width: 14px; height: 14px; border-left: 1px solid var(--c); }
.mark::before { content: ""; position: absolute; left: -7px; top: 6px; width: 14px; border-top: 1px solid var(--c); }
.mark::after { content: attr(data-label); position: absolute; left: 4px; top: 8px; font-size: 10px; color: var(--c); white-space: nowrap; }
#mark-t { --c: var(--accent); }
#mark-a { --c: var(--mark-a); }
#dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px #000; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip, .btn, select, input[type="search"] { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 36px; }
select, input[type="search"] { min-width: 0; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip[data-el]::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:disabled, select:disabled, input:disabled { opacity: .45; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
.field { display: grid; grid-template-columns: 74px minmax(0, 1fr) 70px; gap: 10px; align-items: center; min-height: 38px; }
.field input[type="range"] { width: 100%; height: 30px; accent-color: var(--accent); }
.val { font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
#scrub { flex: 1; min-width: 120px; accent-color: var(--accent); }
#time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; min-width: 64px; text-align: right; }
#fx { width: 100%; }
#summary { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-family: inherit; }
#status { color: var(--ok); font-size: 13px; min-height: 1.4em; }
.two { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }
</style>
<main>
  <header>
    <h1>이펙트 배치 도구</h1>
    <span class="dim" id="built"></span>
  </header>
  <div class="row">
    <select id="entry" aria-label="공격 계열"></select>
    <div class="row" id="stages" aria-label="블록 수"></div>
  </div>
  <div id="stage" aria-label="전투 화면. 끌어서 고른 이펙트 자리를 옮긴다">
    <div id="world"><img alt="전투 화면 (1배 캡처)"><div class="mark" id="mark-t" data-label="맞는 쪽"></div><div class="mark" id="mark-a" data-label="치는 쪽"></div><div id="dot"></div></div>
  </div>
  <div class="row">
    <button class="btn" id="play" type="button">멈춤</button>
    <input id="scrub" type="range" min="0" max="800" value="0" aria-label="재생 시각">
    <span id="time"></span>
    <label class="row"><input id="repeat" type="checkbox" checked> 반복</label>
  </div>
  <div class="row" id="elements" aria-label="미리볼 속성 색"></div>
  <div class="two">
    <section class="panel">
      <h2>연타</h2>
      <div id="hitbox"></div>
      <h2>이펙트 (한 공격에 최대 3개)</h2>
      <div class="row" id="layertabs"></div>
      <div class="row">
        <button class="btn" id="addlayer" type="button">이펙트 추가</button>
        <button class="btn" id="dellayer" type="button">고른 이펙트 빼기</button>
        <button class="btn" id="copystage" type="button">이 블록 이펙트를 1·2·3블록에 복사</button>
      </div>
    </section>
    <section class="panel" id="layeredit">
      <h2>고른 이펙트</h2>
      <input id="fxsearch" type="search" placeholder="찾기 (예: slash, hit, fire, 타격)" aria-label="이펙트 찾기">
      <select id="fx" aria-label="이펙트"></select>
      <div class="row" id="colorseg" aria-label="색"></div>
      <div class="row" id="anchorseg" aria-label="기준"></div>
      <div class="row" id="whenseg" aria-label="나오는 때"></div>
      <div id="layerbox"></div>
      <label class="row"><input id="altflip" type="checkbox"> 연타 짝수 번째 위아래 뒤집기</label>
    </section>
  </div>
  <pre id="summary"></pre>
  <div class="row">
    <button class="btn primary" id="fix" type="button">확정</button>
    <button class="btn" id="reset" type="button">이 계열 처음 값으로</button>
    <button class="btn" id="copy" type="button">값 복사</button>
  </div>
  <div id="status" role="status"></div>
</main>
<script>/*DATA*/</script>
<script>/*JS*/</script>
