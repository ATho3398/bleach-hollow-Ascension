<title>이펙트 배치 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 한 화면 도구: 위 = 실제 전투 화면(1배 캡처) 무대, 아래 = 고르기·조절 칸. 게임과 같은 어두운 기기 화면 하나로 고정 */
:root {
  --bg: #0f1116; --panel: #181b23; --line: #2a2f3b; --fg: #e8e4da; --dim: #9a9ca6;
  --accent: #e8c26a; --accent-ink: #1a1408; --ok: #7cc48a;
  --font: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
main { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
.dim { color: var(--dim); font-size: 12px; }
#stage { position: relative; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: grab; background: #000; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world img { display: block; width: 100%; height: 100%; image-rendering: pixelated; user-select: none; pointer-events: none; }
.pxfx { position: absolute; background-repeat: no-repeat; image-rendering: pixelated; pointer-events: none; }
#cross, #dot { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
#cross { width: 14px; height: 14px; border-left: 1px solid var(--accent); }
#cross::before { content: ""; position: absolute; left: -7px; top: 6px; width: 14px; border-top: 1px solid var(--accent); }
#dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px #000; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip, .btn, .step, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 36px; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip[data-el]::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.panel h2 { margin: 0; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
#fields { display: grid; gap: 6px; }
.field { display: grid; grid-template-columns: 84px minmax(0, 1fr) 64px; gap: 10px; align-items: center; min-height: 40px; }
.field input[type="range"] { width: 100%; height: 32px; accent-color: var(--accent); }
.val { font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
#scrub { flex: 1; min-width: 120px; accent-color: var(--accent); }
#time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; min-width: 92px; text-align: right; }
#summary { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
#status { color: var(--ok); font-size: 13px; min-height: 1.4em; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<main>
  <header>
    <h1>이펙트 배치 도구</h1>
    <span class="dim" id="built"></span>
  </header>
  <div class="row">
    <label class="dim" for="entry">계열</label>
    <select id="entry"></select>
  </div>
  <div id="stage" aria-label="전투 화면. 끌어서 이펙트 자리를 옮긴다">
    <div id="world"><img alt="전투 화면 (1배 캡처)"><div id="cross"></div><div id="dot"></div></div>
  </div>
  <div class="row">
    <button class="btn" id="play" type="button" aria-pressed="true">멈춤</button>
    <input id="scrub" type="range" min="0" max="800" value="0" aria-label="재생 시각">
    <span id="time"></span>
    <label class="row"><input id="repeat" type="checkbox" checked> 반복</label>
  </div>
  <div class="two">
    <section class="panel">
      <h2>미리보기</h2>
      <div class="row" id="elements" aria-label="속성 색"></div>
      <div class="row" id="stages" aria-label="체인 단계"></div>
      <p class="dim" style="margin:0">노란 +는 맞는 몸 가운데, 노란 점은 이펙트 가운데다. 무대를 끌어도 자리가 옮겨진다.</p>
    </section>
    <section class="panel">
      <h2>자리 · 크기 · 각도 (속성 8색 공통)</h2>
      <div id="fields"></div>
      <label class="row"><input id="altflip" type="checkbox"> 연타 짝수 번째 위아래 뒤집기</label>
    </section>
  </div>
  <div id="summary"></div>
  <div class="row">
    <button class="btn primary" id="fix" type="button">확정</button>
    <button class="btn" id="reset" type="button">게임 값으로 되돌리기</button>
    <button class="btn" id="copy" type="button">값 복사</button>
  </div>
  <div id="status" role="status"></div>
</main>
<script>/*DATA*/</script>
<script>/*JS*/</script>
